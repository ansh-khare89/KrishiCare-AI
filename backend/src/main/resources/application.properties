# Server Configuration
server.port=8080
#spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Image Storage (local | cloudinary)
storage.type=local
storage.local.upload-dir=uploads

# FastAPI ML Microservice endpoint URL
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Cloudinary Image Storage API Configuration (only used when storage.type=cloudinary)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# OpenWeatherMap API Configuration (optional - will use mock data if not provided)
weather.api.key=${WEATHER_API_KEY:}

# Servlet Multipart Upload Config (limits file size upload up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
