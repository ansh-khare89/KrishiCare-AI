# Server Configuration
server.port=8080
spring.profiles.active=dev

# Image Storage (local | cloudinary)
storage.type=local
storage.local.upload-dir=uploads

# FastAPI ML Microservice endpoint URL
ml.service.url=http://localhost:8000

# Cloudinary Image Storage API Configuration (only used when storage.type=cloudinary)
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret

# Servlet Multipart Upload Config (limits file size upload up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
